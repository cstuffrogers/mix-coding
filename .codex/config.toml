[mcp_servers.context7]
command = "npx"
args = [
    "-y",
    "@upstash/context7-mcp@latest",
]

[mcp_servers.github]
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-github",
]
env_vars = ["GITHUB_PERSONAL_ACCESS_TOKEN"]

[mcp_servers.mempalace]
command = 'C:\Users\Administrator\.local\bin\mempalace-mcp.exe'

[mcp_servers.sentry]
command = "npx"
args = [
    "-y",
    "sentry-mcp",
]
env_vars = ["SENTRY_AUTH_TOKEN"]

# code-review-graph — Tree-sitter 代码知识图谱 (blast radius / 语义搜索 / 架构社区 / 审查 guidance)
